{% extends "base.html" %}

{% block title %}Add Question - MyCodeLab{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Add New Question</h1>
    
    <form method="POST" class="question-form">
        <div class="form-group">
            <label for="title">Title *</label>
            <input type="text" id="title" name="title" required class="form-control">
        </div>
        
        <div class="form-group">
            <label for="description">Description *</label>
            <textarea id="description" name="description" required class="form-control" rows="6"></textarea>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="language">Language</label>
                <select name="language" class="form-control">
                    <option value="C">C</option>
                    <option value="C++">C++</option>
                    <option value="Python">Python</option>
                    <option value="Java">Java</option>
                    <option value="JavaScript">JavaScript</option>
                    <option value="SQL">SQL</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="difficulty">Difficulty</label>
                <select name="difficulty" class="form-control">
                    <option value="Easy">Easy</option>
                    <option value="Medium">Medium</option>
                    <option value="Hard">Hard</option>
                </select>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="topic">Topic</label>
                <input type="text" id="topic" name="topic" class="form-control">
            </div>
            
            <div class="form-group">
                <label for="tags">Tags (comma-separated)</label>
                <input type="text" id="tags" name="tags" class="form-control">
            </div>
        </div>
        
        <div class="form-group">
            <label for="expected_output">Expected Output</label>
            <textarea id="expected_output" name="expected_output" class="form-control" rows="4"></textarea>
        </div>
        
        <div class="form-group">
            <label for="hints">Hints</label>
            <textarea id="hints" name="hints" class="form-control" rows="3"></textarea>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Create Question</button>
            <a href="{{ url_for('questions.list_questions') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
